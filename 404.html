<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 - Page Not Found | LG CHEM</title>
<style>
  /* ===== CHANGE THESE 5 COLORS TO MATCH YOUR SITE ===== */
  :root {
    --primary: #0b5ed7;      /* header, button, accents */
    --primary-dark: #084298; /* button hover */
    --bg: #f4f7fb;          /* page background */
    --text: #1f2937;        /* main text */
    --muted: #6b7280;       /* secondary text */
  }
  /* ==================================================== */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--primary);
    color: #fff;
    padding: 16px 24px;
  }
  header a {
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .box { max-width: 440px; }
  h1 {
    font-size: 96px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -2px;
    line-height: 1;
  }
  h2 { font-size: 24px; margin: 12px 0; }
  p { color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--primary-dark); }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid rgba(0, 0, 0, 0.08);
  }
  footer div + div { margin-top: 4px; }
</style>
</head>
<body>

  <header>
    <a href="/">LG CHEM</a>
  </header>

  <main>
    <div class="box">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a class="btn" href="/">Back to Home</a>
    </div>
  </main>

  <footer>
    <div>&copy; 2026 LG CHEM. All rights reserved.</div>
    <div>Tikapur 3, Kailali, Nepal</div>
  </footer>

</body>
</html>
