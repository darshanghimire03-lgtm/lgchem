<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - LG CHEM</title>

    <link rel="icon" type="image/png" href="../favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body data-base="../">

    <nav class="navbar">
        <a href="../index.html" class="brand-container">
            <img src="../favicon.png" alt="LG CHEM Logo" class="brand-logo">
            <div class="brand-name">LG <span>CHEM</span></div>
        </a>
        <div class="nav-icons">
            <a href="../auth/index.html" class="icon-btn" id="profileLink" aria-label="Profile">
                <i class="fas fa-user-circle"></i>
            </a>

            <div class="user-menu" id="userMenu">
                <div class="user-chip" id="userChip">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <span class="user-name" id="userNameLabel">Account</span>
                    <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <span class="account-type-badge" id="userTypeBadge">Customer</span>
                    <a href="../user/index.html"><i class="fas fa-id-card"></i> My Account</a>
                    <a href="#"><i class="fas fa-box"></i> My Orders</a>
                    <button class="logout-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>

            <a href="../cart/index.html" class="icon-btn active-page" aria-label="Cart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </a>
        </div>
    </nav>

    <section class="cart-section">
        <div class="cart-header">
            <h2 class="cart-title">Your <span>Cart</span></h2>
            <a href="../index.html#products" class="continue-shopping">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </a>
        </div>

        <div id="cartRoot">
            <div class="state-panel">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>Loading your cart…</h3>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 <span>LG CHEM</span>. All rights reserved.</p>
        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">Tikapur 3, Kailali, Nepal</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../session.js"></script>
    <script src="../script.js"></script>

</body>
</html>
