<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LG Chem – Shopping</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #f9f9f9;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #111; min-height: 100vh; padding: 1.5rem 2rem;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 3rem; flex-wrap: wrap; gap: 1rem;
    }
    .brand { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.02em; color: #a50034; user-select: none; }
    .header-right { display: flex; align-items: center; gap: 1.8rem; }
    .cart-icon, .user-icon {
      position: relative; font-size: 1.8rem; color: #333; cursor: pointer;
      transition: color 0.2s; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .cart-icon:hover, .user-icon:hover { color: #a50034; }
    .cart-badge {
      position: absolute; top: -8px; right: -12px;
      background-color: #a50034; color: white; font-size: 0.75rem; font-weight: bold;
      border-radius: 50%; min-width: 20px; height: 20px; padding: 0 4px;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .user-icon .avatar {
      width: 40px; height: 40px; border-radius: 50%; background-color: #a50034; color: white;
      font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
      text-transform: uppercase; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(165,0,52,0.25);
    }
    .user-icon .status-dot {
      position: absolute; bottom: 0; right: 0; width: 12px; height: 12px;
      border-radius: 50%; background: #2e7d32; border: 2px solid #fff; display: none;
    }
    .user-icon.signed-in .status-dot { display: block; }
    .product-container { max-width: 1000px; margin: 0 auto; display: flex; justify-content: center; }
    .product-card {
      background: white; border-radius: 2rem; padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.02);
      display: flex; flex-direction: column; align-items: center;
      max-width: 500px; width: 100%; border: 1px solid #eee;
    }
    .product-image {
      font-size: 6rem; color: #a50034; margin-bottom: 1.5rem; background: #fef2f4;
      width: 180px; height: 180px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .product-title { font-size: 2rem; font-weight: 600; margin-bottom: 0.5rem; text-align: center; }
    .product-description { font-size: 1rem; color: #555; text-align: center; margin-bottom: 1.5rem; line-height: 1.5; }
    .product-price { font-size: 2rem; font-weight: 700; color: #a50034; margin-bottom: 1.5rem; }
    .product-price span { font-size: 1rem; font-weight: 400; color: #777; }
    .btn-add {
      background-color: #a50034; border: 1px solid #a50034; color: white;
      font-size: 1.2rem; font-weight: 500; padding: 1rem 2.5rem; border-radius: 3rem;
      display: flex; align-items: center; gap: 0.8rem; cursor: pointer;
      transition: background 0.2s, transform 0.1s; width: 100%; justify-content: center;
    }
    .btn-add:hover { background-color: #8a002b; }
    .btn-add:active { transform: scale(0.98); }
    .btn-add:disabled { opacity: 0.6; cursor: not-allowed; }

    .dialog-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .dialog-overlay.open { opacity: 1; pointer-events: auto; }
    .dialog {
      background: white; border-radius: 1.6rem; padding: 2rem; width: 100%; max-width: 460px;
      max-height: 85vh; overflow-y: auto; transform: translateY(15px);
      transition: transform 0.25s; box-shadow: 0 25px 60px rgba(0,0,0,0.2);
    }
    .dialog-overlay.open .dialog { transform: translateY(0); }
    .dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .dialog-header h2 { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .dialog-header h2 i { color: #a50034; }
    .dialog-close {
      background: #f4f4f4; border: none; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; font-size: 1rem; color: #555;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .dialog-close:hover { background: #fdecea; color: #c62828; }

    .cart-items { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.2rem; }
    .cart-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 1rem; background: #fafafa; border: 1px solid #f0f0f0;
      border-radius: 1rem; gap: 0.75rem;
    }
    .cart-row-info { flex: 1; min-width: 0; }
    .cart-row-name { font-size: 0.95rem; font-weight: 500; margin-bottom: 0.2rem; word-break: break-word; }
    .cart-row-qty { font-size: 0.8rem; color: #777; }
    .cart-row-price { font-weight: 700; color: #a50034; font-size: 0.95rem; white-space: nowrap; }
    .cart-row-remove {
      background: transparent; border: none; color: #c62828; cursor: pointer;
      padding: 0.4rem; border-radius: 0.5rem; transition: background 0.2s;
    }
    .cart-row-remove:hover { background: #fdecea; }

    .cart-total {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 1rem; margin-bottom: 1.2rem;
      border-top: 2px dashed #eee; font-weight: 700;
    }
    .cart-total .label { font-size: 1rem; }
    .cart-total .value { color: #a50034; font-size: 1.4rem; }

    .cart-actions { display: flex; flex-direction: column; gap: 0.6rem; }
    .cart-actions .btn {
      width: 100%; padding: 0.9rem 1rem; border-radius: 3rem;
      font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      transition: all 0.2s; text-decoration: none;
    }
    .btn-checkout { background: #a50034; color: white; border: 1px solid #a50034; }
    .btn-checkout:hover { background: #8a002b; }
    .btn-continue { background: white; color: #333; border: 1px solid #ddd; }
    .btn-continue:hover { border-color: #a50034; color: #a50034; }

    .cart-empty { text-align: center; color: #888; padding: 2rem 0; font-size: 0.95rem; }

    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #2e7d32; color: white; padding: 0.9rem 1.5rem; border-radius: 3rem;
      font-size: 0.95rem; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      display: flex; align-items: center; gap: 0.6rem; opacity: 0;
      transition: transform 0.3s, opacity 0.3s; z-index: 1100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: #c62828; }

    @media (max-width: 500px) {
      body { padding: 1rem; }
      .brand { font-size: 2rem; }
      .header-right { gap: 1.2rem; }
      .cart-icon, .user-icon { font-size: 1.5rem; }
      .user-icon .avatar { width: 34px; height: 34px; font-size: 0.85rem; }
      .product-card { padding: 1.8rem; }
      .dialog { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">LG Chem</div>
    <div class="header-right">
      <a href="#" class="cart-icon" id="cartIcon" title="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="auth/index.html" class="user-icon" id="userIcon" title="Account">
        <i class="fas fa-user-circle" id="userIconGlyph"></i>
        <span class="status-dot"></span>
      </a>
    </div>
  </div>

  <div class="product-container">
    <div class="product-card">
      <div class="product-image"><i class="fas fa-spray-can"></i></div>
      <div class="product-title">LG Chem All‑Purpose Cleaner</div>
      <div class="product-description">
        Professional‑grade chemical cleaner. Safe on most surfaces, powerful on grease and grime.
      </div>
      <div class="product-price">$19.99 <span> / bottle</span></div>
      <button class="btn-add" id="addToCartBtn">
        <i class="fas fa-cart-plus"></i> Add to Cart
      </button>
    </div>
  </div>

  <div class="dialog-overlay" id="cartDialog">
    <div class="dialog">
      <div class="dialog-header">
        <h2><i class="fas fa-shopping-cart"></i> Your Cart</h2>
        <button class="dialog-close" id="closeCartDialog" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="cartDialogBody">
        <div class="cart-empty">Loading…</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastText">Added to cart</span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-helpers.js"></script>

  <script>
    (function () {
      if (!window.LGChemAuth) {
        console.error('❌ App not initialized. Check console.');
        return;
      }

      const { onAuthChange, fetchCartCount, addProductToCart, getCartItems, removeFromCart, errInfo } = window.LGChemAuth;

      const addToCartBtn = document.getElementById('addToCartBtn');
      const cartBadge = document.getElementById('cartBadge');
      const cartIcon = document.getElementById('cartIcon');
      const userIcon = document.getElementById('userIcon');
      const cartDialog = document.getElementById('cartDialog');
      const closeCartDialog = document.getElementById('closeCartDialog');
      const cartDialogBody = document.getElementById('cartDialogBody');
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');

      let currentUser = null;
      const product = { id: 'cleaner_001', name: 'LG Chem All‑Purpose Cleaner', price: 19.99 };

      function setBadge(n) { cartBadge.textContent = n || 0; }

      function showToast(msg, isError = false) {
        toastText.textContent = msg;
        toast.className = 'toast ' + (isError ? 'error' : '');
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      onAuthChange(async (user) => {
        currentUser = user;
        if (user) {
          const initial = (user.displayName || user.email || '?').trim().charAt(0).toUpperCase();
          userIcon.innerHTML = `<span class="avatar">${initial}</span><span class="status-dot"></span>`;
          userIcon.classList.add('signed-in');
          userIcon.href = 'user/index.html';
          userIcon.title = 'My account';
          try { setBadge(await fetchCartCount(user.uid)); } catch { setBadge(0); }
        } else {
          userIcon.innerHTML = '<i class="fas fa-user-circle"></i><span class="status-dot"></span>';
          userIcon.classList.remove('signed-in');
          userIcon.href = 'auth/index.html';
          userIcon.title = 'Sign in / Sign up';
          setBadge(0);
        }
      });

      addToCartBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!currentUser) { window.location.href = 'auth/index.html'; return; }

        addToCartBtn.disabled = true;
        try {
          const result = await addProductToCart(currentUser.uid, product);
          setBadge(result.count);
          showToast('Added to cart!');
          openCartDialog();
        } catch (err) {
          const info = errInfo(err);
          console.error('Add to cart error:', info);
          showToast('Could not add: ' + info.message, true);
        } finally {
          addToCartBtn.disabled = false;
        }
      });

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }

      async function renderCartDialog() {
        if (!currentUser) {
          cartDialogBody.innerHTML = '<div class="cart-empty">Please sign in to view your cart.</div>';
          return;
        }
        cartDialogBody.innerHTML = '<div class="cart-empty">Loading…</div>';
        const items = await getCartItems(currentUser.uid);

        if (!items.length) {
          cartDialogBody.innerHTML = '<div class="cart-empty">Your cart is empty.</div>';
          return;
        }

        const rows = items.map((i) => `
          <div class="cart-row">
            <div class="cart-row-info">
              <div class="cart-row-name">${escapeHtml(i.name)}</div>
              <div class="cart-row-qty">Qty: ${i.quantity} × $${Number(i.price).toFixed(2)}</div>
            </div>
            <div class="cart-row-price">$${(i.price * i.quantity).toFixed(2)}</div>
            <button class="cart-row-remove" data-id="${i.id}" title="Remove">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        `).join('');

        const total = items.reduce((s, i) => s + i.price * i.quantity, 0);

        cartDialogBody.innerHTML = `
          <div class="cart-items">${rows}</div>
          <div class="cart-total">
            <span class="label">Total</span>
            <span class="value">$${total.toFixed(2)}</span>
          </div>
          <div class="cart-actions">
            <button class="btn btn-checkout" id="checkoutBtn">
              <i class="fas fa-credit-card"></i> Checkout
            </button>
            <button class="btn btn-continue" id="continueBtn">Continue shopping</button>
          </div>
        `;

        cartDialogBody.querySelectorAll('.cart-row-remove').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            try {
              const res = await removeFromCart(currentUser.uid, id);
              setBadge(res.count);
              await renderCartDialog();
              showToast('Item removed');
            } catch (err) {
              const info = errInfo(err);
              console.error('Remove error:', info);
              showToast('Could not remove: ' + info.message, true);
            }
          });
        });

        const checkoutBtn = document.getElementById('checkoutBtn');
        if (checkoutBtn) checkoutBtn.addEventListener('click', () => showToast('Checkout not yet available'));
        const continueBtn = document.getElementById('continueBtn');
        if (continueBtn) continueBtn.addEventListener('click', closeCartDialogFn);
      }

      function openCartDialog() {
        cartDialog.classList.add('open');
        renderCartDialog();
      }
      function closeCartDialogFn() { cartDialog.classList.remove('open'); }

      cartIcon.addEventListener('click', (e) => {
        e.preventDefault();
        if (!currentUser) { window.location.href = 'auth/index.html'; return; }
        openCartDialog();
      });

      closeCartDialog.addEventListener('click', closeCartDialogFn);
      cartDialog.addEventListener('click', (e) => {
        if (e.target === cartDialog) closeCartDialogFn();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && cartDialog.classList.contains('open')) closeCartDialogFn();
      });
    })();
  </script>
</body>
</html>
