<form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-msg" id="loginMsg"></div>

    <div class="input-group">
        <label>Email Address</label>
        <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>
        </div>
    </div>

    <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
        </div>
    </div>

    <div class="input-group" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <label style="display: flex; align-items: center; gap: 5px; font-weight: 400; margin-bottom: 0; cursor: pointer;">
            <input type="checkbox" style="width: auto; padding: 0; margin-right: 5px;"> Remember me
        </label>
        <a onclick="handleForgotPassword()" style="font-size: 0.8rem; color: var(--bright-green); text-decoration: none; font-weight: 600; cursor:pointer;">Forgot Password?</a>
    </div>

    <button type="submit" class="btn-submit" id="loginSubmitBtn">
        Login <i class="fas fa-arrow-right"></i>
    </button>

    <div class="form-footer">
        Don't have an account? <a onclick="switchTab('signup')">Sign up here</a>
    </div>
</form>
