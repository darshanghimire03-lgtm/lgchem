<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-label="Your cart" aria-hidden="true">
    <div class="cart-drawer-head">
        <h2>Your <span>Cart</span></h2>
        <button type="button" class="cart-drawer-close" id="cartClose" aria-label="Close cart">
            <i class="fas fa-xmark"></i>
        </button>
    </div>
    <div id="cartRoot">
        <div class="state-panel">
            <i class="fas fa-spinner fa-spin"></i>
            <h3>Loading your cart…</h3>
        </div>
    </div>
</aside>
