<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG Chem - Quality Chemicals</title>
    
    <!-- FAVICON FROM MAIN DIRECTORY -->
    <!-- Make sure your logo image is in the same folder as this HTML file and named 'favicon.png' -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS VARIABLES (Matching Logo Colors) --- */
        :root {
            --dark-blue: #002B5B; /* Matches 'LG' */
            --bright-green: #008000; /* Matches 'Chem' and leaves */
            --light-bg: #f4f8fb;
            --white: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* --- RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- NAVIGATION BAR --- */
        .navbar {
            background-color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Top Left: Favicon & Name */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--dark-blue);
            /* Fallback background if image doesn't load */
            background-color: var(--light-bg); 
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-blue);
            letter-spacing: 1px;
        }

        .brand-name span {
            color: var(--bright-green);
        }

        /* Top Right: Profile & Cart Icons */
        .nav-icons {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--dark-blue);
            transition: color 0.3s ease, transform 0.2s ease;
            position: relative;
        }

        .icon-btn:hover {
            color: var(--bright-green);
            transform: scale(1.1);
        }

        /* Cart Badge */
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--bright-green);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            flex: 1; /* Pushes footer to bottom */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .under-dev-box {
            background: var(--white);
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
            border-top: 6px solid var(--dark-blue);
            border-bottom: 6px solid var(--bright-green);
        }

        .under-dev-box i {
            font-size: 4rem;
            color: var(--bright-green);
            margin-bottom: 20px;
        }

        .under-dev-box h2 {
            color: var(--dark-blue);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .under-dev-box p {
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.6;
        }

        /* --- FOOTER --- */
        .footer {
            background-color: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-top: auto;
        }

        .footer p {
            opacity: 0.9;
        }

        .footer span {
            color: #66bb6a; /* Lighter green for contrast */
            font-weight: 600;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 600px) {
            .navbar {
                padding: 12px 15px;
            }
            .brand-logo {
                width: 35px;
                height: 35px;
            }
            .brand-name {
                font-size: 1.2rem;
            }
            .nav-icons {
                gap: 15px;
            }
            .icon-btn {
                font-size: 1.1rem;
            }
            .under-dev-box {
                padding: 30px 20px;
            }
            .under-dev-box h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <nav class="navbar">
        
        <!-- Top Left: Favicon & Name -->
        <div class="brand-container">
            <!-- This logo pulls from the main directory -->
            <img src="favicon.png" alt="LG Chem Logo" class="brand-logo">
            <div class="brand-name">LG <span>Chem</span></div>
        </div>

        <!-- Top Right: Profile & Cart Icons -->
        <div class="nav-icons">
            <button class="icon-btn" aria-label="Profile">
                <i class="fas fa-user-circle"></i>
            </button>
            <button class="icon-btn" aria-label="Cart">
                <i class="fas fa-shopping-cart"></i>
                <!-- Optional Cart Badge -->
                <span class="cart-badge">0</span>
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
        <div class="under-dev-box">
            <i class="fas fa-tools"></i>
            <h2>Website Under Development</h2>
            <p>
                We are currently working hard to bring you a better online experience. 
                <br><br>
                <strong>No products are available at this moment.</strong> 
                Please check back soon!
            </p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 <span>LG Chem</span>. All rights reserved.</p>
        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">Tikapur 3, Kailali, Nepal</p>
    </footer>

</body>
</html>
