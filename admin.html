<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - LG CHEM</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">

    <style>
        body { background: var(--light-bg); }

        .admin-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 5% 60px 5%;
            flex-grow: 1;
            width: 100%;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            color: var(--dark-blue);
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-header h1 i { color: var(--bright-green); }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .admin-tab-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid var(--dark-blue);
            background: var(--white);
            color: var(--dark-blue);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-tab-btn.active {
            background: var(--dark-blue);
            color: var(--white);
        }

        .admin-panel { display: none; }
        .admin-panel.active { display: block; }

        .admin-card {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eaeaea;
            padding: 25px;
            margin-bottom: 25px;
        }

        .admin-card h3 {
            color: var(--dark-blue);
            font-size: 1.1rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-card h3 i { color: var(--bright-green); }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .admin-input-group { margin-bottom: 15px; }

        .admin-input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-blue);
            margin-bottom: 5px;
        }

        .admin-input-group input,
        .admin-input-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Poppins', sans-serif;
            background: var(--white);
            color: var(--text-dark);
        }

        .admin-input-group input:focus,
        .admin-input-group select:focus {
            outline: none;
            border-color: var(--bright-green);
            box-shadow: 0 0 0 3px rgba(0, 128, 0, 0.1);
        }

        .btn-admin-submit {
            padding: 12px 24px;
            background-color: var(--bright-green);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-admin-submit:hover { background-color: var(--dark-blue); }
        .btn-admin-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .admin-msg {
            font-size: 0.85rem;
            margin-bottom: 15px;
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
        }

        .admin-msg.error { display: block; color: var(--error-red); background: rgba(217, 83, 79, 0.08); }
        .admin-msg.success { display: block; color: var(--bright-green); background: rgba(0, 128, 0, 0.08); }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .admin-table th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text-light);
            font-size: 0.75rem;
            text-transform: uppercase;
            border-bottom: 2px solid #eee;
        }

        .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            color: var(--text-dark);
            vertical-align: middle;
        }

        .admin-table img {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 6px;
        }

        .table-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .table-empty i {
            font-size: 2rem;
            color: #ccc;
            display: block;
            margin-bottom: 10px;
        }

        .btn-icon-danger {
            background: none;
            border: none;
            color: var(--error-red);
            cursor: pointer;
            font-size: 1rem;
            padding: 6px 8px;
        }

        .btn-icon-danger:hover { color: #a33; }

        .order-status-pill {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(0, 128, 0, 0.08);
            color: var(--bright-green);
        }

        .table-scroll { overflow-x: auto; }

        .state-panel {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eaeaea;
        }

        .state-panel i {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 20px;
            display: block;
        }

        .state-panel h3 { color: var(--dark-blue); font-size: 1.3rem; margin-bottom: 10px; }
        .state-panel p { color: var(--text-light); font-size: 0.95rem; margin-bottom: 20px; }

        .state-panel a.shop-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bright-green);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .state-panel a.shop-link:hover { background-color: var(--dark-blue); }

        @media (max-width: 650px) {
            .form-row { grid-template-columns: 1fr; }
            .admin-tabs { flex-direction: column; }
            .admin-tab-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body data-base="">

    <nav class="navbar">
        <a href="index.html" class="brand-container">
            <img src="favicon.png" alt="LG CHEM Logo" class="brand-logo">
            <div class="brand-name">LG <span>CHEM</span></div>
        </a>
        <div class="nav-icons">
            <a href="auth/index.html" class="icon-btn" id="profileLink" aria-label="Profile">
                <i class="fas fa-user-circle"></i>
            </a>
            <div class="user-menu" id="userMenu">
                <div class="user-chip" id="userChip">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <span class="user-name" id="userNameLabel">Account</span>
                    <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <span class="account-type-badge" id="userTypeBadge">Customer</span>
                    <a href="user/index.html"><i class="fas fa-id-card"></i> My Account</a>
                    <a href="admin.html"><i class="fas fa-toolbox"></i> Admin Panel</a>
                    <button class="logout-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <a href="cart/index.html" class="icon-btn" aria-label="Cart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </a>
        </div>
    </nav>

    <div class="admin-wrap">
        <div id="adminRoot">
            <div class="state-panel">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>Loading admin panel…</h3>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 <span>LG CHEM</span>. All rights reserved.</p>
        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">Tikapur 3, Kailali, Nepal</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script>
        const BASE = document.body.getAttribute('data-base') || '';

        function initials(name) {
            if (!name) return '?';
            return name.trim().charAt(0).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function refreshCartBadge(uid) {
            const badge = document.getElementById('cartBadge');
            if (!badge) return;
            if (!uid || !window.LGChem) {
                badge.textContent = '0';
                return;
            }
            window.LGChem.rtdb.ref('carts/' + uid).once('value')
                .then(function (snap) {
                    const val = snap.val();
                    const count = val ? Object.values(val).reduce(function (sum, item) { return sum + (item.qty || 1); }, 0) : 0;
                    badge.textContent = count;
                })
                .catch(function (err) { console.error('Failed to load cart count:', err); });
        }

        function wireUserMenu() {
            const profileLink = document.getElementById('profileLink');
            const userMenu = document.getElementById('userMenu');
            const userChip = document.getElementById('userChip');
            const userDropdown = document.getElementById('userDropdown');
            const userAvatar = document.getElementById('userAvatar');
            const userNameLabel = document.getElementById('userNameLabel');
            const userTypeBadge = document.getElementById('userTypeBadge');
            const logoutBtn = document.getElementById('logoutBtn');

            if (!profileLink || !userMenu || !userChip || !userDropdown) return;

            userChip.addEventListener('click', function () {
                userDropdown.classList.toggle('open');
            });

            profileLink.addEventListener('click', function (e) {
                if (window.LGSession && window.LGSession.isLoggedIn()) {
                    e.preventDefault();
                    window.location.href = BASE + 'user/index.html';
                }
            });

            document.addEventListener('click', function (e) {
                if (!userMenu.contains(e.target)) {
                    userDropdown.classList.remove('open');
                }
            });

            if (logoutBtn) {
                logoutBtn.addEventListener('click', function () {
                    window.LGChem.signOut().then(function () {
                        window.LGSession.clear();
                        window.location.href = BASE + 'index.html';
                    });
                });
            }

            if (!window.LGSession) return;

            function applySessionToNavbar(session) {
                if (session) {
                    profileLink.style.display = 'none';
                    userMenu.style.display = 'flex';
                    if (userAvatar) userAvatar.textContent = initials(session.name);
                    if (userNameLabel) userNameLabel.textContent = session.name;
                    if (userTypeBadge) userTypeBadge.textContent = (session.accountType || 'customer').toUpperCase();
                    refreshCartBadge(session.uid);
                } else {
                    profileLink.style.display = 'inline-flex';
                    userMenu.style.display = 'none';
                    userDropdown.classList.remove('open');
                    refreshCartBadge(null);
                }
            }

            applySessionToNavbar(window.LGSession.getCached());
            window.LGSession.onChange(function (session) { applySessionToNavbar(session); });
        }

        function renderLoggedOutState() {
            const root = document.getElementById('adminRoot');
            root.innerHTML = `
                <div class="state-panel">
                    <i class="fas fa-user-lock"></i>
                    <h3>Please log in</h3>
                    <p>You need a seller account to access the admin panel.</p>
                    <a href="${BASE}auth/index.html" class="shop-link"><i class="fas fa-right-to-bracket"></i> Log In</a>
                </div>
            `;
        }

        function renderNotAuthorizedState() {
            const root = document.getElementById('adminRoot');
            root.innerHTML = `
                <div class="state-panel">
                    <i class="fas fa-ban"></i>
                    <h3>Access restricted</h3>
                    <p>Only seller accounts can access the admin panel.</p>
                    <a href="${BASE}index.html" class="shop-link"><i class="fas fa-store"></i> Go to Store</a>
                </div>
            `;
        }

        function renderAdminShell() {
            const root = document.getElementById('adminRoot');
            root.innerHTML = `
                <div class="admin-header">
                    <h1><i class="fas fa-toolbox"></i> Admin Panel</h1>
                </div>

                <div class="admin-tabs">
                    <button class="admin-tab-btn active" id="tabBtnProducts" onclick="showAdminTab('products')">
                        <i class="fas fa-box"></i> Products
                    </button>
                    <button class="admin-tab-btn" id="tabBtnOrders" onclick="showAdminTab('orders')">
                        <i class="fas fa-receipt"></i> Orders
                    </button>
                </div>

                <div class="admin-panel active" id="panelProducts">
                    <div class="admin-card">
                        <h3><i class="fas fa-plus-circle"></i> Add Product</h3>
                        <div class="admin-msg" id="productMsg"></div>
                        <form id="addProductForm">
                            <div class="form-row">
                                <div class="admin-input-group">
                                    <label>Product Name</label>
                                    <input type="text" id="prodName" placeholder="e.g. Sulphuric Acid" required>
                                </div>
                                <div class="admin-input-group">
                                    <label>Category</label>
                                    <input type="text" id="prodCategory" placeholder="e.g. Industrial Acids" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="admin-input-group">
                                    <label>Price</label>
                                    <input type="text" id="prodPrice" placeholder="e.g. Rs. 1200" required>
                                </div>
                                <div class="admin-input-group">
                                    <label>Unit</label>
                                    <input type="text" id="prodUnit" placeholder="e.g. per 25kg drum" required>
                                </div>
                            </div>
                            <div class="admin-input-group">
                                <label>Image URL</label>
                                <input type="text" id="prodImage" placeholder="https://example.com/image.jpg">
                            </div>
                            <button type="submit" class="btn-admin-submit" id="addProductBtn">
                                <i class="fas fa-plus"></i> Add Product
                            </button>
                        </form>
                    </div>

                    <div class="admin-card">
                        <h3><i class="fas fa-list"></i> All Products</h3>
                        <div id="productsListWrap">
                            <div class="table-empty"><i class="fas fa-spinner fa-spin"></i>Loading products…</div>
                        </div>
                    </div>
                </div>

                <div class="admin-panel" id="panelOrders">
                    <div class="admin-card">
                        <h3><i class="fas fa-receipt"></i> All Orders</h3>
                        <div id="ordersListWrap">
                            <div class="table-empty"><i class="fas fa-spinner fa-spin"></i>Loading orders…</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('addProductForm').addEventListener('submit', handleAddProduct);
            loadProducts();
            loadOrders();
        }

        function showAdminTab(tab) {
            const panelProducts = document.getElementById('panelProducts');
            const panelOrders = document.getElementById('panelOrders');
            const btnProducts = document.getElementById('tabBtnProducts');
            const btnOrders = document.getElementById('tabBtnOrders');

            if (tab === 'products') {
                panelProducts.classList.add('active');
                panelOrders.classList.remove('active');
                btnProducts.classList.add('active');
                btnOrders.classList.remove('active');
            } else {
                panelOrders.classList.add('active');
                panelProducts.classList.remove('active');
                btnOrders.classList.add('active');
                btnProducts.classList.remove('active');
            }
        }

        function showAdminMsg(id, text, type) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.className = 'admin-msg ' + type;
        }

        function clearAdminMsg(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = '';
            el.className = 'admin-msg';
        }

        function handleAddProduct(event) {
            event.preventDefault();
            clearAdminMsg('productMsg');

            if (!window.LGChem || !window.LGChem.rtdb) {
                showAdminMsg('productMsg', 'Could not connect to the database.', 'error');
                return;
            }

            const name = document.getElementById('prodName').value.trim();
            const category = document.getElementById('prodCategory').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const unit = document.getElementById('prodUnit').value.trim();
            const image = document.getElementById('prodImage').value.trim();
            const btn = document.getElementById('addProductBtn');

            if (!name || !category || !price || !unit) {
                showAdminMsg('productMsg', 'Please fill in all required fields.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Adding… <i class="fas fa-spinner fa-spin"></i>';

            const newRef = window.LGChem.rtdb.ref('products').push();
            newRef.set({
                name: name,
                category: category,
                price: price,
                unit: unit,
                image: image || '',
                createdAt: new Date().toISOString()
            }).then(function () {
                showAdminMsg('productMsg', 'Product added successfully.', 'success');
                document.getElementById('addProductForm').reset();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus"></i> Add Product';
                loadProducts();
            }).catch(function (err) {
                showAdminMsg('productMsg', 'Failed to add product: ' + (err.message || err), 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus"></i> Add Product';
            });
        }

        function loadProducts() {
            const wrap = document.getElementById('productsListWrap');
            if (!wrap) return;

            if (!window.LGChem || !window.LGChem.rtdb) {
                wrap.innerHTML = '<div class="table-empty"><i class="fas fa-triangle-exclamation"></i>Could not connect to the database.</div>';
                return;
            }

            window.LGChem.rtdb.ref('products').once('value')
                .then(function (snap) {
                    const val = snap.val();
                    const products = val
                        ? Object.keys(val).map(function (key) { return Object.assign({ key: key }, val[key]); })
                        : [];
                    renderProductsTable(products);
                })
                .catch(function (err) {
                    console.error('Failed to load products:', err);
                    wrap.innerHTML = '<div class="table-empty"><i class="fas fa-triangle-exclamation"></i>Failed to load products.</div>';
                });
        }

        function renderProductsTable(products) {
            const wrap = document.getElementById('productsListWrap');
            if (!wrap) return;

            if (!products || products.length === 0) {
                wrap.innerHTML = `
                    <div class="table-empty">
                        <i class="fas fa-box-open"></i>
                        No products added yet. Use the form above to add your first product.
                    </div>
                `;
                return;
            }

            const rows = products.map(function (p) {
                return `
                    <tr>
                        <td><img src="${escapeHtml(p.image) || 'https://via.placeholder.com/60x60?text=No+Image'}" alt="" onerror="this.src='https://via.placeholder.com/60x60?text=No+Image'"></td>
                        <td>${escapeHtml(p.name)}</td>
                        <td>${escapeHtml(p.category)}</td>
                        <td>${escapeHtml(p.price)}</td>
                        <td>${escapeHtml(p.unit)}</td>
                        <td><button class="btn-icon-danger" onclick="handleDeleteProduct('${p.key}')" aria-label="Delete product"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `;
            }).join('');

            wrap.innerHTML = `
                <div class="table-scroll">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Unit</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function handleDeleteProduct(key) {
            if (!window.LGChem || !window.LGChem.rtdb) return;
            if (!confirm('Delete this product? This cannot be undone.')) return;

            window.LGChem.rtdb.ref('products/' + key).remove()
                .then(function () { loadProducts(); })
                .catch(function (err) { alert('Failed to delete product: ' + (err.message || err)); });
        }

        function loadOrders() {
            const wrap = document.getElementById('ordersListWrap');
            if (!wrap) return;

            if (!window.LGChem || !window.LGChem.rtdb) {
                wrap.innerHTML = '<div class="table-empty"><i class="fas fa-triangle-exclamation"></i>Could not connect to the database.</div>';
                return;
            }

            window.LGChem.rtdb.ref('orders').once('value')
                .then(function (snap) {
                    const val = snap.val();
                    const orders = [];

                    if (val) {
                        Object.keys(val).forEach(function (uid) {
                            const userOrders = val[uid];
                            Object.keys(userOrders).forEach(function (orderKey) {
                                orders.push(Object.assign({ key: orderKey, uid: uid }, userOrders[orderKey]));
                            });
                        });
                    }

                    orders.sort(function (a, b) {
                        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                    });

                    renderOrdersTable(orders);
                })
                .catch(function (err) {
                    console.error('Failed to load orders:', err);
                    wrap.innerHTML = '<div class="table-empty"><i class="fas fa-triangle-exclamation"></i>Failed to load orders.</div>';
                });
        }

        function renderOrdersTable(orders) {
            const wrap = document.getElementById('ordersListWrap');
            if (!wrap) return;

            if (!orders || orders.length === 0) {
                wrap.innerHTML = `
                    <div class="table-empty">
                        <i class="fas fa-receipt"></i>
                        No orders placed yet.
                    </div>
                `;
                return;
            }

            const rows = orders.map(function (o) {
                const itemsSummary = o.items
                    ? Object.values(o.items).map(function (i) { return escapeHtml(i.name) + ' x' + (i.qty || 1); }).join(', ')
                    : '—';
                const total = o.total !== undefined ? formatMoney(o.total) : '—';
                const created = o.createdAt ? new Date(o.createdAt).toLocaleString() : '—';
                const status = o.status || 'pending';

                return `
                    <tr>
                        <td>${escapeHtml(o.key)}</td>
                        <td>${escapeHtml(o.customerName || o.uid)}</td>
                        <td>${itemsSummary}</td>
                        <td>${total}</td>
                        <td><span class="order-status-pill">${escapeHtml(status)}</span></td>
                        <td>${created}</td>
                    </tr>
                `;
            }).join('');

            wrap.innerHTML = `
                <div class="table-scroll">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Placed</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function formatMoney(n) {
            const num = typeof n === 'number' ? n : parseFloat(n) || 0;
            return 'Rs. ' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
        }

        function initAdminPage() {
            if (!window.LGSession) {
                renderLoggedOutState();
                return;
            }

            window.LGSession.onChange(function (session, confirmed) {
                if (!confirmed) return;

                if (!session) {
                    renderLoggedOutState();
                    return;
                }

                if ((session.accountType || 'customer') !== 'seller') {
                    renderNotAuthorizedState();
                    return;
                }

                renderAdminShell();
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            wireUserMenu();
            initAdminPage();
        });
    </script>

</body>
</html>
