<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - LG CHEM</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-blue: #002B5B;
            --bright-green: #008000;
            --light-bg: #f4f8fb;
            --white: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --card-shadow: 0 10px 25px rgba(0,0,0,0.08);
            --error-red: #d9534f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--dark-blue);
            background-color: var(--light-bg);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-blue);
            letter-spacing: 1px;
        }

        .brand-name span {
            color: var(--bright-green);
        }

        .nav-icons {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--dark-blue);
            transition: color 0.3s ease, transform 0.2s ease;
            position: relative;
            text-decoration: none;
        }

        .icon-btn:hover {
            color: var(--bright-green);
            transform: scale(1.1);
        }

        .icon-btn.active-page {
            color: var(--bright-green);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--bright-green);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .user-menu {
            display: none;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--light-bg);
            padding: 6px 14px 6px 8px;
            border-radius: 50px;
            cursor: pointer;
            border: 1px solid #e5e5e5;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 50%;
            background: var(--dark-blue);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-blue);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-dropdown {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--white);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            min-width: 180px;
            overflow: hidden;
            border: 1px solid #eaeaea;
            z-index: 200;
        }

        .user-dropdown.open {
            display: block;
        }

        .user-dropdown a, .user-dropdown button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--text-dark);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .user-dropdown a:hover, .user-dropdown button:hover {
            background: var(--light-bg);
        }

        .user-dropdown .logout-item {
            color: #d9534f;
            border-top: 1px solid #f0f0f0;
        }

        .account-type-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--bright-green);
            background: rgba(0,128,0,0.08);
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin: 6px 16px 0 16px;
        }

        .cart-section {
            padding: 40px 5% 60px 5%;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .cart-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cart-title {
            color: var(--dark-blue);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .cart-title span {
            color: var(--bright-green);
        }

        .continue-shopping {
            font-size: 0.9rem;
            color: var(--dark-blue);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .continue-shopping:hover {
            color: var(--bright-green);
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eaeaea;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--light-bg);
            flex-shrink: 0;
        }

        .cart-item-info {
            flex-grow: 1;
            min-width: 0;
        }

        .cart-item-category {
            font-size: 0.75rem;
            color: var(--bright-green);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cart-item-name {
            font-size: 1.05rem;
            color: var(--dark-blue);
            font-weight: 600;
            margin: 3px 0 6px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cart-item-price {
            font-size: 0.95rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .cart-item-unit {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: var(--white);
            color: var(--dark-blue);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--light-bg);
            border-color: var(--bright-green);
            color: var(--bright-green);
        }

        .qty-value {
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--error-red);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 8px;
            flex-shrink: 0;
        }

        .remove-btn:hover {
            color: #a83f3c;
        }

        .summary-card {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eaeaea;
            padding: 25px;
            position: sticky;
            top: 90px;
        }

        .summary-card h3 {
            color: var(--dark-blue);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        .summary-row.total {
            border-top: 1px solid #f0f0f0;
            padding-top: 12px;
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-blue);
        }

        .summary-note {
            font-size: 0.78rem;
            color: var(--text-light);
            margin: 10px 0 20px 0;
            line-height: 1.5;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--bright-green);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .checkout-btn:hover {
            background-color: var(--dark-blue);
            transform: translateY(-2px);
        }

        .checkout-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .state-panel {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eaeaea;
            grid-column: 1 / -1;
        }

        .state-panel i {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 20px;
            display: block;
        }

        .state-panel h3 {
            color: var(--dark-blue);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .state-panel p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .state-panel a.shop-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bright-green);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .state-panel a.shop-link:hover {
            background-color: var(--dark-blue);
        }

        .footer {
            background-color: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-top: auto;
        }

        .footer span {
            color: #66bb6a;
            font-weight: 600;
        }

        @media (max-width: 800px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
            .summary-card {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .navbar { padding: 12px 15px; }
            .brand-logo { width: 35px; height: 35px; }
            .brand-name { font-size: 1.2rem; }
            .nav-icons { gap: 15px; }
            .icon-btn { font-size: 1.1rem; }
            .user-name { display: none; }
            .cart-section { padding: 20px 15px 40px 15px; }
            .cart-title { font-size: 1.4rem; }
            .cart-item { flex-wrap: wrap; }
            .cart-item-image { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-container">
            <img src="favicon.png" alt="LG CHEM Logo" class="brand-logo">
            <div class="brand-name">LG <span>CHEM</span></div>
        </a>
        <div class="nav-icons">
            <a href="auth/index.html" class="icon-btn" id="profileLink" aria-label="Profile">
                <i class="fas fa-user-circle"></i>
            </a>

            <div class="user-menu" id="userMenu">
                <div class="user-chip" id="userChip">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <span class="user-name" id="userNameLabel">Account</span>
                    <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <span class="account-type-badge" id="userTypeBadge">Customer</span>
                    <a href="user/index.html"><i class="fas fa-id-card"></i> My Account</a>
                    <a href="#"><i class="fas fa-box"></i> My Orders</a>
                    <button class="logout-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>

            <a href="cart.html" class="icon-btn active-page" aria-label="Cart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </a>
        </div>
    </nav>

    <section class="cart-section">
        <div class="cart-header">
            <h2 class="cart-title">Your <span>Cart</span></h2>
            <a href="index.html#products" class="continue-shopping">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </a>
        </div>

        <div id="cartRoot">
            <div class="state-panel">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>Loading your cart…</h3>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 <span>LG CHEM</span>. All rights reserved.</p>
        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">Tikapur 3, Kailali, Nepal</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="session.js"></script>

    <script>
        let currentUid = null;

        function priceToNumber(priceStr) {
            if (!priceStr) return 0;
            const digits = String(priceStr).replace(/[^0-9.]/g, '');
            const n = parseFloat(digits);
            return isNaN(n) ? 0 : n;
        }

        function formatMoney(n) {
            return 'Rs. ' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
        }

        function renderLoggedOutState() {
            document.getElementById('cartRoot').innerHTML = `
                <div class="state-panel">
                    <i class="fas fa-user-lock"></i>
                    <h3>Please log in to view your cart</h3>
                    <p>Your cart is tied to your account so it's there whenever you come back.</p>
                    <a href="auth/index.html" class="shop-link"><i class="fas fa-right-to-bracket"></i> Log In</a>
                </div>
            `;
        }

        function renderEmptyState() {
            document.getElementById('cartRoot').innerHTML = `
                <div class="state-panel">
                    <i class="fas fa-cart-shopping"></i>
                    <h3>No cart products found</h3>
                    <p>You haven't added anything to your cart yet. Start exploring our products.</p>
                    <a href="index.html#products" class="shop-link"><i class="fas fa-bag-shopping"></i> Shop Now</a>
                </div>
            `;
        }

        function renderErrorState() {
            document.getElementById('cartRoot').innerHTML = `
                <div class="state-panel">
                    <i class="fas fa-triangle-exclamation"></i>
                    <h3>Couldn't load your cart</h3>
                    <p>Please refresh the page or try again in a moment.</p>
                </div>
            `;
        }

        function renderCart(items) {
            if (!items || items.length === 0) {
                renderEmptyState();
                return;
            }

            let subtotal = 0;
            const itemsHtml = items.map(function (item) {
                const lineTotal = priceToNumber(item.price) * (item.qty || 1);
                subtotal += lineTotal;
                return `
                    <div class="cart-item" data-key="${item.key}">
                        <img src="${item.image || 'https://via.placeholder.com/100x100?text=No+Image'}" alt="${item.name}" class="cart-item-image" onerror="this.src='https://via.placeholder.com/100x100?text=No+Image'">
                        <div class="cart-item-info">
                            <div class="cart-item-category">${item.category || ''}</div>
                            <div class="cart-item-name">${item.name || 'Unnamed product'}</div>
                            <div class="cart-item-price">${item.price || ''} <span class="cart-item-unit">${item.unit || ''}</span></div>
                            <div class="qty-controls">
                                <button class="qty-btn" data-action="dec" data-key="${item.key}">−</button>
                                <span class="qty-value">${item.qty || 1}</span>
                                <button class="qty-btn" data-action="inc" data-key="${item.key}">+</button>
                            </div>
                        </div>
                        <button class="remove-btn" data-action="remove" data-key="${item.key}" aria-label="Remove item">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('cartRoot').innerHTML = `
                <div class="cart-layout">
                    <div class="cart-items">${itemsHtml}</div>
                    <div class="summary-card">
                        <h3>Order Summary</h3>
                        <div class="summary-row">
                            <span>Items</span>
                            <span>${items.reduce(function (s, i) { return s + (i.qty || 1); }, 0)}</span>
                        </div>
                        <div class="summary-row total">
                            <span>Estimated Total</span>
                            <span>${formatMoney(subtotal)}</span>
                        </div>
                        <p class="summary-note">Final pricing, delivery charges, and business/bulk discounts are confirmed at checkout.</p>
                        <button class="checkout-btn" id="checkoutBtn">
                            Proceed to Checkout <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;

            wireCartItemControls();

            document.getElementById('checkoutBtn').addEventListener('click', function () {
                alert('Checkout isn\\'t connected yet — this is where order placement will go.');
            });
        }

        function wireCartItemControls() {
            document.querySelectorAll('.qty-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const key = btn.getAttribute('data-key');
                    const action = btn.getAttribute('data-action');
                    changeQty(key, action === 'inc' ? 1 : -1);
                });
            });

            document.querySelectorAll('.remove-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const key = btn.getAttribute('data-key');
                    removeItem(key);
                });
            });
        }

        function cartItemRef(key) {
            return window.LGChem.rtdb.ref('carts/' + currentUid + '/' + key);
        }

        function changeQty(key, delta) {
            const ref = cartItemRef(key);
            ref.once('value').then(function (snap) {
                const item = snap.val();
                if (!item) return;
                const newQty = (item.qty || 1) + delta;
                if (newQty <= 0) {
                    return ref.remove();
                }
                return ref.update({ qty: newQty });
            }).catch(function (err) { console.error('Failed to update quantity:', err); });
        }

        function removeItem(key) {
            cartItemRef(key).remove().catch(function (err) { console.error('Failed to remove item:', err); });
        }

        function loadCart(uid) {
            if (!window.LGChem || !window.LGChem.rtdb) {
                renderErrorState();
                return;
            }

            window.LGChem.rtdb.ref('carts/' + uid).on('value', function (snapshot) {
                const val = snapshot.val();
                const items = val
                    ? Object.keys(val).map(function (key) { return Object.assign({ key: key }, val[key]); })
                    : [];
                renderCart(items);
                updateBadge(items);
            }, function (err) {
                console.error('Failed to load cart:', err);
                renderErrorState();
            });
        }

        function updateBadge(items) {
            const badge = document.getElementById('cartBadge');
            const count = items.reduce(function (sum, item) { return sum + (item.qty || 1); }, 0);
            badge.textContent = count;
        }

        function initials(name) {
            if (!name) return '?';
            return name.trim().charAt(0).toUpperCase();
        }

        function wireUserMenu() {
            const profileLink = document.getElementById('profileLink');
            const userMenu = document.getElementById('userMenu');
            const userChip = document.getElementById('userChip');
            const userDropdown = document.getElementById('userDropdown');
            const userAvatar = document.getElementById('userAvatar');
            const userNameLabel = document.getElementById('userNameLabel');
            const userTypeBadge = document.getElementById('userTypeBadge');
            const logoutBtn = document.getElementById('logoutBtn');

            userChip.addEventListener('click', function () {
                userDropdown.classList.toggle('open');
            });

            document.addEventListener('click', function (e) {
                if (!userMenu.contains(e.target)) {
                    userDropdown.classList.remove('open');
                }
            });

            logoutBtn.addEventListener('click', function () {
                window.LGChem.signOut().then(function () {
                    window.LGSession.clear();
                    window.location.reload();
                });
            });

            if (!window.LGSession) return;

            window.LGSession.onChange(function (session) {
                if (session) {
                    profileLink.style.display = 'none';
                    userMenu.style.display = 'flex';
                    userAvatar.textContent = initials(session.name);
                    userNameLabel.textContent = session.name;
                    userTypeBadge.textContent = (session.accountType || 'customer').toUpperCase();

                    if (currentUid !== session.uid) {
                        currentUid = session.uid;
                        loadCart(currentUid);
                    }
                } else {
                    profileLink.style.display = 'inline-flex';
                    userMenu.style.display = 'none';
                    userDropdown.classList.remove('open');

                    if (currentUid && window.LGChem) {
                        window.LGChem.rtdb.ref('carts/' + currentUid).off();
                    }
                    currentUid = null;
                    document.getElementById('cartBadge').textContent = '0';
                    renderLoggedOutState();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', wireUserMenu);
    </script>

</body>
</html>
