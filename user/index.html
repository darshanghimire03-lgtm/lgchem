<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - LG CHEM</title>

    <link rel="icon" type="image/png" href="../favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-blue: #002B5B;
            --bright-green: #008000;
            --light-bg: #f4f8fb;
            --white: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --card-shadow: 0 10px 25px rgba(0,0,0,0.08);
            --error-red: #d9534f;
            --skeleton-base: #e9edf2;
            --skeleton-shine: #f6f8fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--dark-blue);
            background-color: var(--light-bg);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-blue);
            letter-spacing: 1px;
        }

        .brand-name span {
            color: var(--bright-green);
        }

        .nav-icons {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--dark-blue);
            transition: color 0.3s ease, transform 0.2s ease;
            position: relative;
            text-decoration: none;
        }

        .icon-btn:hover {
            color: var(--bright-green);
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--bright-green);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .user-menu {
            display: none;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--light-bg);
            padding: 6px 14px 6px 8px;
            border-radius: 50px;
            cursor: pointer;
            border: 1px solid #e5e5e5;
        }

        .user-chip.active-page {
            border-color: var(--bright-green);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 50%;
            background: var(--dark-blue);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-blue);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-dropdown {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--white);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            min-width: 180px;
            overflow: hidden;
            border: 1px solid #eaeaea;
            z-index: 200;
        }

        .user-dropdown.open {
            display: block;
        }

        .user-dropdown a, .user-dropdown button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--text-dark);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .user-dropdown a:hover, .user-dropdown button:hover {
            background: var(--light-bg);
        }

        .user-dropdown .logout-item {
            color: #d9534f;
            border-top: 1px solid #f0f0f0;
        }

        .account-type-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--bright-green);
            background: rgba(0,128,0,0.08);
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin: 6px 16px 0 16px;
        }

        .account-section {
            padding: 40px 5% 60px 5%;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .account-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .account-avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--dark-blue);
            color: var(--white);
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .account-header-info h2 {
            color: var(--dark-blue);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .account-header-info p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .account-type-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--bright-green);
            background: rgba(0,128,0,0.08);
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 8px;
        }

        .details-card {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eaeaea;
            padding: 30px;
            margin-bottom: 25px;
        }

        .details-card h3 {
            color: var(--dark-blue);
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .details-card h3 i {
            color: var(--bright-green);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 15px;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .detail-label i {
            width: 16px;
            text-align: center;
            color: var(--dark-blue);
        }

        .detail-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            text-align: right;
            word-break: break-word;
        }

        .detail-value.muted {
            color: var(--text-light);
            font-weight: 400;
            font-style: italic;
        }

        .actions-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-outline {
            flex: 1;
            min-width: 160px;
            padding: 13px;
            background: var(--white);
            color: var(--dark-blue);
            border: 2px solid var(--dark-blue);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-outline:hover {
            background: var(--dark-blue);
            color: var(--white);
        }

        .btn-danger-outline {
            flex: 1;
            min-width: 160px;
            padding: 13px;
            background: var(--white);
            color: var(--error-red);
            border: 2px solid var(--error-red);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-danger-outline:hover {
            background: var(--error-red);
            color: var(--white);
        }

        .state-panel {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eaeaea;
        }

        .state-panel i {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 20px;
            display: block;
        }

        .state-panel h3 {
            color: var(--dark-blue);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .state-panel p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .state-panel pre {
            text-align: left;
            background: #fff5f5;
            border: 1px solid #ffd7d7;
            color: #a33;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            overflow-x: auto;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .state-panel .diag-list {
            text-align: left;
            background: #f4f8fb;
            border: 1px solid #dbe6f0;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #333;
        }

        .state-panel .diag-list div {
            padding: 4px 0;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .state-panel .diag-ok { color: #2a8f2a; }
        .state-panel .diag-bad { color: #d9534f; font-weight: 700; }

        .state-panel a.shop-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bright-green);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        .state-panel a.shop-link:hover {
            background-color: var(--dark-blue);
        }

        .skeleton-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .skeleton {
            position: relative;
            overflow: hidden;
            background-color: var(--skeleton-base);
            border-radius: 8px;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
            animation: skeleton-shine 1.4s infinite;
        }

        @keyframes skeleton-shine {
            100% { transform: translateX(100%); }
        }

        .skeleton-avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .skeleton-line {
            height: 16px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .skeleton-header-lines {
            flex: 1;
            min-width: 180px;
        }

        .skeleton-line.w-60 { width: 60%; height: 22px; }
        .skeleton-line.w-40 { width: 40%; }
        .skeleton-line.w-30 { width: 30%; height: 20px; border-radius: 20px; }

        .skeleton-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 15px;
        }

        .skeleton-detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .skeleton-line.label { width: 35%; height: 14px; }
        .skeleton-line.value { width: 40%; height: 14px; margin-bottom: 0; }

        .skeleton-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .skeleton-btn {
            flex: 1;
            min-width: 160px;
            height: 46px;
            border-radius: 8px;
        }

        .footer {
            background-color: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-top: auto;
        }

        .footer span {
            color: #66bb6a;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .navbar { padding: 12px 15px; }
            .brand-logo { width: 35px; height: 35px; }
            .brand-name { font-size: 1.2rem; }
            .nav-icons { gap: 15px; }
            .icon-btn { font-size: 1.1rem; }
            .user-name { display: none; }
            .account-section { padding: 20px 15px 40px 15px; }
            .account-header { flex-direction: column; text-align: center; }
            .account-header-info { text-align: center; }
            .details-card { padding: 20px; }
            .detail-row { flex-direction: column; align-items: flex-start; gap: 4px; }
            .detail-value { text-align: left; }
            .actions-row { flex-direction: column; }
            .skeleton-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <section class="account-section">
        <div id="accountRoot">
            <div class="skeleton-header">
                <div class="skeleton skeleton-avatar-lg"></div>
                <div class="skeleton-header-lines">
                    <div class="skeleton skeleton-line w-60"></div>
                    <div class="skeleton skeleton-line w-40"></div>

            </div>

                <div class="skeleton skeleton-line w-40" style="height:20px;"></div>

                    <div class="skeleton skeleton-line value"></div>
                </div>
                <div class="skeleton-detail-row">
                    <div class="skeleton skeleton-line label"></div>
                    <div class="skeleton skeleton-line value"></div>
                </div>
                <div class="skeleton-detail-row">
                    <div class="skeleton skeleton-line label"></div>
                    <div class="skeleton skeleton-line value"></div>
                </div>
                <div class="skeleton-detail-row">
                    <div class="skeleton skeleton-line label"></div>
                    <div class="skeleton skeleton-line value"></div>
                </div>
            </div>
            <div class="details-card">
                <div class="skeleton skeleton-line w-40" style="height:20px;"></div>
                <div class="skeleton-actions">

                    <div class="skeleton skeleton-btn"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 <span>LG CHEM</span>. All rights reserved.</p>
        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">Tikapur 3, Kailali, Nepal</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../session.js"></script>

    <script>
        function initials(name) {
            if (!name) return '?';
            return name.trim().charAt(0).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function renderSkeletonState() {
            document.getElementById('accountRoot').innerHTML = `
                <div class="skeleton-header">
                    <div class="skeleton skeleton-avatar-lg"></div>
                    <div class="skeleton-header-lines">
                        <div class="skeleton skeleton-line w-60"></div>
                        <div class="skeleton skeleton-line w-40"></div>
                        <div class="skeleton skeleton-line w-30"></div>
                    </div>
                </div>
                <div class="details-card">
                    <div class="skeleton skeleton-line w-40" style="height:20px;"></div>
                    <div class="skeleton-detail-row">
                        <div class="skeleton skeleton-line label"></div>
                        <div class="skeleton skeleton-line value"></div>
                    </div>
                    <div class="skeleton-detail-row">
                        <div class="skeleton skeleton-line label"></div>
                        <div class="skeleton skeleton-line value"></div>
                    </div>
                    <div class="skeleton-detail-row">
                        <div class="skeleton skeleton-line label"></div>
                        <div class="skeleton skeleton-line value"></div>
                    </div>
                    <div class="skeleton-detail-row">
                        <div class="skeleton skeleton-line label"></div>
                        <div class="skeleton skeleton-line value"></div>
                    </div>
                </div>
                <div class="details-card">
                    <div class="skeleton skeleton-line w-40" style="height:20px;"></div>
                    <div class="skeleton-actions">
                        <div class="skeleton skeleton-btn"></div>
                        <div class="skeleton skeleton-btn"></div>
                        <div class="skeleton skeleton-btn"></div>
                    </div>
                </div>
            `;
        }

        function renderLoggedOutState() {
            document.getElementById('accountRoot').innerHTML = `
                <div class="state-panel">
                    <i class="fas fa-user-lock"></i>
                    <h3>Please log in to view your account</h3>
                    <p>Sign in to see your saved details, orders, and account settings.</p>
                    <a href="../auth/index.html" class="shop-link"><i class="fas fa-right-to-bracket"></i> Log In / Sign Up</a>
                </div>
            `;
        }

        function runDiagnostics() {
            const diags = [];
            diags.push({ label: 'Firebase SDK loaded (firebase object exists)', ok: typeof firebase !== 'undefined' });
            diags.push({ label: 'firebase-config.js ran without error (window.LGChem exists)', ok: !!window.LGChem });
            diags.push({ label: 'window.LGChem.auth exists', ok: !!(window.LGChem && window.LGChem.auth) });
            diags.push({ label: 'window.LGChem.rtdb exists', ok: !!(window.LGChem && window.LGChem.rtdb) });
            diags.push({ label: 'session.js loaded (window.LGSession exists)', ok: !!window.LGSession });
            if (window.LGChemInitError) {
                diags.push({ label: 'Firebase init error: ' + window.LGChemInitError, ok: false });
            }
            return diags;
        }

        function renderErrorState(err, diagnostics) {
            const detail = err ? (err.code ? (err.code + ': ' + (err.message || '')) : (err.message || String(err))) : 'Unknown error';
            let diagHtml = '';
            if (diagnostics && diagnostics.length) {
                diagHtml = '<div class="diag-list">' + diagnostics.map(function (d) {
                    return '<div class="' + (d.ok ? 'diag-ok' : 'diag-bad') + '"><i class="fas ' + (d.ok ? 'fa-circle-check' : 'fa-circle-xmark') + '"></i> ' + escapeHtml(d.label) + '</div>';
                }).join('') + '</div>';
            }
            document.getElementById('accountRoot').innerHTML = `
                <div class="state-panel">
                    <i class="fas fa-triangle-exclamation"></i>
                    <h3>Couldn't load your account</h3>
                    <p>Here is exactly what failed:</p>
                    ${diagHtml}
                    <pre>${escapeHtml(detail)}</pre>
                    <a href="#" class="shop-link" onclick="location.reload(); return false;"><i class="fas fa-rotate-right"></i> Retry</a>
                </div>
            `;
        }

        function renderAccount(uid, email, displayNameFromAuth, profile) {
            const accountType = (profile && profile.accountType) || 'customer';
            const isSeller = accountType === 'seller';
            const displayName = (profile && profile.name) || displayNameFromAuth || email;

            const nameFieldLabel = isSeller ? 'Shop Name' : 'Full Name';
            const nameFieldIcon = isSeller ? 'fa-store' : 'fa-user';

            let detailsHtml = `
                <div class="detail-row">
                    <span class="detail-label"><i class="fas ${nameFieldIcon}"></i> ${nameFieldLabel}</span>
                    <span class="detail-value">${escapeHtml(displayName) || '<span class=\\'muted\\'>Not set</span>'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-envelope"></i> Email</span>
                    <span class="detail-value">${escapeHtml(email)}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-phone"></i> Phone</span>
                    <span class="detail-value">${profile && profile.phone ? escapeHtml(profile.phone) : '<span class="detail-value muted">Not set</span>'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-map-marker-alt"></i> Address</span>
                    <span class="detail-value">${profile && profile.address ? escapeHtml(profile.address) : '<span class="detail-value muted">Not set</span>'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-fingerprint"></i> User ID</span>
                    <span class="detail-value">${escapeHtml(uid)}</span>
                </div>
            `;

            if (isSeller) {
                detailsHtml += `
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-id-badge"></i> Shop Owner Name</span>
                        <span class="detail-value">${profile && profile.ownerName ? escapeHtml(profile.ownerName) : '<span class="detail-value muted">Not set</span>'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-file-invoice"></i> VAT No.</span>
                        <span class="detail-value">${profile && profile.vatNo ? escapeHtml(profile.vatNo) : '<span class="detail-value muted">Not provided</span>'}</span>
                    </div>
                `;
            }

            const createdAt = profile && profile.createdAt ? new Date(profile.createdAt) : null;
            const createdAtLabel = createdAt && !isNaN(createdAt)
                ? createdAt.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
                : null;

            document.getElementById('accountRoot').innerHTML = `
                <div class="account-header">
                    <div class="account-avatar-lg">${initials(displayName)}</div>
                    <div class="account-header-info">
                        <h2>${escapeHtml(displayName)}</h2>
                        <p>${escapeHtml(email)}</p>
                        <span class="account-type-pill">
                            <i class="fas ${isSeller ? 'fa-store' : 'fa-user'}"></i> ${accountType.toUpperCase()} ACCOUNT
                        </span>
                    </div>
                </div>

                <div class="details-card">
                    <h3><i class="fas fa-address-card"></i> Account Details</h3>
                    ${detailsHtml}
                    ${createdAtLabel ? `
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-calendar-check"></i> Member Since</span>
                        <span class="detail-value">${createdAtLabel}</span>
                    </div>` : ''}
                </div>

                <div class="details-card">
                    <h3><i class="fas fa-gear"></i> Account Actions</h3>
                    <div class="actions-row">
                        <a href="../cart.html" class="btn-outline"><i class="fas fa-shopping-cart"></i> View Cart</a>
                        <button class="btn-outline" id="resetPasswordBtn" type="button"><i class="fas fa-key"></i> Reset Password</button>
                        <button class="btn-danger-outline" id="accountLogoutBtn" type="button"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            `;

            document.getElementById('resetPasswordBtn').addEventListener('click', function () {
                window.LGChem.auth.sendPasswordResetEmail(email)
                    .then(function () { alert('Password reset email sent to ' + email); })
                    .catch(function (err) { alert('Could not send reset email: ' + (err.message || err)); });
            });

            document.getElementById('accountLogoutBtn').addEventListener('click', function () {
                window.LGChem.signOut().then(function () {
                    window.LGSession.clear();
                    window.location.href = '../index.html';
                });
            });
        }

        let loadToken = 0;

        function loadAccountForSession(session) {
            const myToken = ++loadToken;
            renderSkeletonState();

            const diags = runDiagnostics();
            const hasFailure = diags.some(function (d) { return !d.ok; });
            if (hasFailure) {
                renderErrorState({ message: 'One or more required scripts failed to load or initialize.' }, diags);
                return;
            }

            window.LGChem.rtdb.ref('users/' + session.uid).once('value')
                .then(function (snap) {
                    if (myToken !== loadToken) return;
                    const profile = snap.val();
                    if (!profile) {
                        renderErrorState(
                            { message: 'The database read succeeded but returned no data at users/' + session.uid + '. Either the profile was never saved at signup, or your Realtime Database rules are silently blocking this read.' },
                            diags
                        );
                        return;
                    }
                    renderAccount(session.uid, session.email, session.name, profile);
                })
                .catch(function (err) {
                    if (myToken !== loadToken) return;
                    console.error('Failed to load profile from users/' + session.uid, err);
                    renderErrorState(err, diags);
                });
        }

        function wireUserMenu() {
            const profileLink = document.getElementById('profileLink');
            const userMenu = document.getElementById('userMenu');
            const userChip = document.getElementById('userChip');
            const userDropdown = document.getElementById('userDropdown');
            const userAvatar = document.getElementById('userAvatar');
            const userNameLabel = document.getElementById('userNameLabel');
            const userTypeBadge = document.getElementById('userTypeBadge');
            const logoutBtn = document.getElementById('logoutBtn');

            userChip.addEventListener('click', function () {
                userDropdown.classList.toggle('open');
            });

            document.addEventListener('click', function (e) {
                if (!userMenu.contains(e.target)) {
                    userDropdown.classList.remove('open');
                }
            });

            logoutBtn.addEventListener('click', function () {
                window.LGChem.signOut().then(function () {
                    window.LGSession.clear();
                    window.location.href = '../index.html';
                });
            });

            if (!window.LGSession) {
                renderErrorState({ message: 'session.js did not load. Check the script tag path ../session.js and that the file was uploaded.' }, runDiagnostics());
                return;
            }

            window.LGSession.onChange(function (session, confirmed) {
                if (session) {
                    profileLink.style.display = 'none';
                    userMenu.style.display = 'flex';
                    userAvatar.textContent = initials(session.name);
                    userNameLabel.textContent = session.name;
                    userTypeBadge.textContent = (session.accountType || 'customer').toUpperCase();
                    refreshCartBadge(session.uid);
                    loadAccountForSession(session);
                } else if (confirmed) {
                    profileLink.style.display = 'inline-flex';
                    userMenu.style.display = 'none';
                    userDropdown.classList.remove('open');
                    document.getElementById('cartBadge').textContent = '0';
                    renderLoggedOutState();
                } else {
                    renderSkeletonState();
                }
            });
        }

        function refreshCartBadge(uid) {
            const badge = document.getElementById('cartBadge');
            if (!uid || !window.LGChem) {
                badge.textContent = '0';
                return;
            }
            window.LGChem.rtdb.ref('carts/' + uid).once('value')
                .then(function (snap) {
                    const val = snap.val();
                    const count = val ? Object.values(val).reduce(function (sum, item) { return sum + (item.qty || 1); }, 0) : 0;
                    badge.textContent = count;
                })
                .catch(function (err) { console.error('Failed to load cart count:', err); });
        }

        document.addEventListener('DOMContentLoaded', wireUserMenu);
    </script>

</body>
</html>
