<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account – LG Chem</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #f9f9f9;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #111; min-height: 100vh; padding: 1.5rem 2rem;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 1rem; color: #555; text-decoration: none;
      margin-bottom: 2rem; transition: color 0.2s;
    }
    .back-link:hover { color: #a50034; }
    .container { max-width: 760px; margin: 0 auto; }
    .brand { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.02em; color: #a50034; margin-bottom: 2rem; text-align: center; }
    .card {
      background: white; border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.02);
      border: 1px solid #eee; padding: 2.5rem; margin-bottom: 1.5rem;
    }
    .profile-header {
      display: flex; align-items: center; gap: 1.5rem;
      padding-bottom: 1.8rem; border-bottom: 1px solid #eee;
      margin-bottom: 1.8rem; flex-wrap: wrap;
    }
    .avatar-lg {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #a50034, #d81b60);
      color: white; font-size: 2.2rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      text-transform: uppercase; box-shadow: 0 8px 20px rgba(165,0,52,0.25);
      flex-shrink: 0;
    }
    .profile-meta { flex: 1; min-width: 200px; }
    .profile-meta h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; word-break: break-word; }
    .profile-meta .sub {
      font-size: 0.9rem; color: #777;
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    }
    .account-type-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.7rem; border-radius: 1rem;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .account-type-badge.personal { background: #e3f2fd; color: #0d47a1; }
    .account-type-badge.shopkeeper { background: #fff3e0; color: #e65100; }

    .info-grid { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
    .info-row {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.2rem; background: #fafafa;
      border: 1px solid #f0f0f0; border-radius: 1rem;
    }
    .info-row .icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff0f3; color: #a50034;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .info-row .label {
      font-size: 0.78rem; color: #888; text-transform: uppercase;
      letter-spacing: 0.04em; font-weight: 600; margin-bottom: 0.15rem;
    }
    .info-row .value { font-size: 0.98rem; color: #111; font-weight: 500; word-break: break-all; }

    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-top: 1.8rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem;
      padding: 0.85rem 1.6rem; border-radius: 3rem;
      font-family: inherit; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.2s;
      border: 1px solid transparent;
    }
    .btn-primary { background: #a50034; color: white; border-color: #a50034; }
    .btn-primary:hover { background: #8a002b; }
    .btn-danger { background: white; color: #c62828; border-color: #f5c6cb; }
    .btn-danger:hover { background: #fdecea; border-color: #c62828; }

    .loading { text-align: center; color: #888; padding: 3rem 0; }

    .cart-section h3 {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .cart-section h3 i { color: #a50034; }
    .cart-empty { text-align: center; color: #888; padding: 1.5rem 0; font-size: 0.95rem; }
    .cart-list { display: flex; flex-direction: column; gap: 0.7rem; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 1.1rem; background: #fafafa;
      border: 1px solid #f0f0f0; border-radius: 1rem; gap: 1rem;
    }
    .cart-item .name { font-weight: 500; font-size: 0.95rem; }
    .cart-item .qty { font-size: 0.8rem; color: #777; }
    .cart-item .price { font-weight: 700; color: #a50034; font-size: 0.95rem; white-space: nowrap; }
    .cart-total {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 1rem; margin-top: 1rem;
      border-top: 2px dashed #eee; font-weight: 700; font-size: 1.05rem;
    }
    .cart-total .total-value { color: #a50034; font-size: 1.3rem; }

    @media (max-width: 500px) {
      body { padding: 1rem; }
      .brand { font-size: 2rem; }
      .card { padding: 1.6rem; }
      .avatar-lg { width: 70px; height: 70px; font-size: 1.7rem; }
      .profile-meta h2 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to shop</a>
    <div class="brand">LG Chem</div>

    <div id="loadingState" class="card loading">
      <i class="fas fa-spinner fa-spin" style="font-size:1.6rem; color:#a50034;"></i>
      <p style="margin-top:1rem;">Loading your account…</p>
    </div>

    <div id="accountContent" style="display:none;">
      <div class="card">
        <div class="profile-header">
          <div class="avatar-lg" id="avatarLg">U</div>
          <div class="profile-meta">
            <h2 id="displayName">User</h2>
            <div class="sub">
              <i class="fas fa-envelope" style="color:#a50034;"></i>
              <span id="emailText">—</span>
              <span class="account-type-badge personal" id="accountTypeBadge">
                <i class="fas fa-user"></i> <span id="accountTypeText">Personal</span>
              </span>
            </div>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-row" id="nameRow">
            <div class="icon"><i class="fas fa-id-card" id="nameIconRow"></i></div>
            <div style="flex:1; min-width:0;">
              <div class="label" id="nameLabelRow">Full name</div>
              <div class="value" id="nameText">—</div>
            </div>
          </div>

          <div class="info-row">
            <div class="icon"><i class="fas fa-envelope-open-text"></i></div>
            <div style="flex:1; min-width:0;">
              <div class="label">Email</div>
              <div class="value" id="emailRow">—</div>
            </div>
          </div>

          <div class="info-row">
            <div class="icon"><i class="fas fa-phone"></i></div>
            <div style="flex:1; min-width:0;">
              <div class="label">Phone</div>
              <div class="value" id="phoneText">—</div>
            </div>
          </div>

          <div class="info-row">
            <div class="icon"><i class="fas fa-map-marker-alt"></i></div>
            <div style="flex:1; min-width:0;">
              <div class="label">Location</div>
              <div class="value" id="locationText">—</div>
            </div>
          </div>

          <div class="info-row">
            <div class="icon"><i class="fas fa-fingerprint"></i></div>
            <div style="flex:1; min-width:0;">
              <div class="label">User ID</div>
              <div class="value" id="uidText">—</div>
            </div>
          </div>

          <div class="info-row">
            <div class="icon"><i class="fas fa-calendar-alt"></i></div>
            <div style="flex:1; min-width:0;">
              <div class="label">Account created</div>
              <div class="value" id="createdText">—</div>
            </div>
          </div>
        </div>

        <div class="actions">
          <a href="../index.html" class="btn btn-primary">
            <i class="fas fa-shopping-bag"></i> Continue shopping
          </a>
          <button class="btn btn-danger" id="signOutBtn">
            <i class="fas fa-sign-out-alt"></i> Sign out
          </button>
        </div>
      </div>

      <div class="card cart-section">
        <h3><i class="fas fa-shopping-cart"></i> Your Cart</h3>
        <div id="cartContent"><div class="cart-empty">Loading…</div></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../auth-helpers.js"></script>
  <script src="user.js"></script>
</body>
</html>
