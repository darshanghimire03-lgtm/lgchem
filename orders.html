<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>My Orders - LG CHEM</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/user-menu.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/state-panel.css">
    <link rel="stylesheet" href="css/orders.css">
</head>
<body data-base="" data-active="orders" data-scripts="firebase-config,auth,cart-helper,orders">

    <div data-include="navbar"></div>

    <section class="orders-section">
        <div class="orders-head">
            <h2><i class="fas fa-box"></i> My Orders</h2>
            <p>Track the status of everything you have ordered.</p>
        </div>

        <div class="orders-tabs" id="ordersTabs" style="display:none;"></div>

        <div id="ordersRoot">
            <div class="order-card">
                <div class="skeleton skeleton-line w-40" style="height:18px;"></div>
                <div class="skeleton skeleton-line w-60"></div>
                <div class="skeleton skeleton-line w-30"></div>
            </div>
            <div class="order-card">
                <div class="skeleton skeleton-line w-40" style="height:18px;"></div>
                <div class="skeleton skeleton-line w-60"></div>
                <div class="skeleton skeleton-line w-30"></div>
            </div>
        </div>
    </section>

    <div data-include="footer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="js/layout.js"></script>

</body>
</html>
