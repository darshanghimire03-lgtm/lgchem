<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Sign Up – LG Chem</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #f9f9f9;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #111; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }
    .back-link {
      position: absolute; top: 1.5rem; left: 1.5rem;
      font-size: 1rem; color: #555; text-decoration: none;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .back-link:hover { color: #a50034; }

    .brand-top {
      font-size: 2rem; font-weight: 600; color: #a50034;
      margin-bottom: 2rem; letter-spacing: -0.02em;
    }

    .auth-card {
      background: white; border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 8px 20px rgba(0,0,0,0.03);
      border: 1px solid #eee; padding: 2.5rem;
      width: 100%; max-width: 460px;
    }

    .tabs {
      display: flex; background: #f4f4f4; border-radius: 3rem;
      padding: 0.35rem; margin-bottom: 2rem;
    }
    .tab {
      flex: 1; border: none; background: transparent; padding: 0.85rem 1rem;
      font-size: 1rem; font-weight: 600; border-radius: 3rem;
      cursor: pointer; color: #666; transition: all 0.2s; font-family: inherit;
    }
    .tab.active {
      background: #a50034; color: white;
      box-shadow: 0 4px 12px rgba(165,0,52,0.25);
    }

    .form-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.35rem; text-align: center; }
    .form-sub { font-size: 0.9rem; color: #777; text-align: center; margin-bottom: 1.5rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.85rem; font-weight: 500;
      color: #444; margin-bottom: 0.4rem;
    }
    .input-wrap { position: relative; }
    .input-wrap i.field-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%); color: #999; font-size: 0.95rem;
    }
    .input-wrap input {
      width: 100%; padding: 0.85rem 1rem 0.85rem 2.6rem;
      border: 1px solid #ddd; border-radius: 0.9rem;
      font-size: 0.95rem; font-family: inherit;
      background: #fafafa; outline: none;
      transition: border 0.2s, background 0.2s; color: #111;
    }
    .input-wrap input:focus { border-color: #a50034; background: #fff; }

    .account-type { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .type-option { position: relative; cursor: pointer; }
    .type-option input { position: absolute; opacity: 0; pointer-events: none; }
    .type-option .box {
      padding: 0.85rem 0.8rem; border: 1.5px solid #e0e0e0; border-radius: 0.9rem;
      background: #fafafa; text-align: center; transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      font-size: 0.85rem; font-weight: 600; color: #555;
    }
    .type-option .box i { font-size: 1.2rem; color: #888; }
    .type-option input:checked + .box {
      border-color: #a50034; background: #fff0f3; color: #a50034;
      box-shadow: 0 4px 12px rgba(165,0,52,0.12);
    }
    .type-option input:checked + .box i { color: #a50034; }

    .checkbox-row {
      display: flex; align-items: flex-start; gap: 0.6rem;
      margin: 1rem 0 0.5rem; font-size: 0.85rem; color: #555; line-height: 1.4;
    }
    .checkbox-row input[type="checkbox"] {
      margin-top: 0.15rem; width: 16px; height: 16px;
      accent-color: #a50034; cursor: pointer; flex-shrink: 0;
    }
    .checkbox-row a { color: #a50034; font-weight: 600; text-decoration: none; }
    .checkbox-row a:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%; padding: 0.95rem 1rem; background: #a50034; color: white;
      border: 1px solid #a50034; border-radius: 3rem;
      font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      transition: background 0.2s, transform 0.1s; margin-top: 1rem;
    }
    .btn-submit:hover { background: #8a002b; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      padding: 0.75rem 1rem; border-radius: 0.9rem;
      font-size: 0.88rem; margin-bottom: 1rem;
      display: flex; align-items: flex-start; gap: 0.5rem; line-height: 1.4;
    }
    .msg.error { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; }
    .msg.success { background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; }
    .msg.hidden { display: none; }
    .msg i { margin-top: 0.15rem; flex-shrink: 0; }

    .switch-hint { text-align: center; font-size: 0.88rem; color: #666; margin-top: 1.5rem; }
    .switch-hint button {
      background: none; border: none; color: #a50034; font-weight: 600;
      cursor: pointer; font-family: inherit; font-size: 0.88rem; padding: 0;
    }
    .switch-hint button:hover { text-decoration: underline; }

    .signup-only { display: none; }
    .signup-only.show { display: block; }

    .loading-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.85);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; flex-direction: column; gap: 1rem;
    }
    .loading-overlay.show { display: flex; }
    .loading-overlay .spinner {
      font-size: 2rem; color: #a50034;
    }
    .loading-overlay p { color: #444; font-weight: 500; }
  </style>
</head>
<body>

  <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to shop</a>
  <div class="brand-top">LG Chem</div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" id="tabSignIn" type="button">Sign In</button>
      <button class="tab" id="tabSignUp" type="button">Sign Up</button>
    </div>

    <div class="form-title" id="formTitle">Welcome back</div>
    <div class="form-sub" id="formSub">Sign in to your LG Chem account</div>

    <div class="msg error hidden" id="msgBox">
      <i class="fas fa-exclamation-circle"></i>
      <span id="msgText"></span>
    </div>

    <form id="authForm" novalidate>

      <!-- SIGNUP-ONLY: Account type -->
      <div class="form-group signup-only" id="accountTypeGroup">
        <label>Account type</label>
        <div class="account-type">
          <label class="type-option">
            <input type="radio" name="accountType" value="personal" checked>
            <div class="box"><i class="fas fa-user"></i><span>Personal</span></div>
          </label>
          <label class="type-option">
            <input type="radio" name="accountType" value="shopkeeper">
            <div class="box"><i class="fas fa-store"></i><span>Shop Keeper</span></div>
          </label>
        </div>
      </div>

      <!-- SIGNUP-ONLY: Full name / Shop name -->
      <div class="form-group signup-only" id="nameGroup">
        <label for="fullName" id="nameLabel">Full name</label>
        <div class="input-wrap">
          <i class="fas fa-user field-icon" id="nameIcon"></i>
          <input type="text" id="fullName" placeholder="John Doe" autocomplete="name">
        </div>
      </div>

      <!-- SIGNUP-ONLY: Phone -->
      <div class="form-group signup-only" id="phoneGroup">
        <label for="phone">Phone number</label>
        <div class="input-wrap">
          <i class="fas fa-phone field-icon"></i>
          <input type="tel" id="phone" placeholder="+1 555 000 0000" autocomplete="tel">
        </div>
      </div>

      <!-- SIGNUP-ONLY: Location -->
      <div class="form-group signup-only" id="locationGroup">
        <label for="location">Location</label>
        <div class="input-wrap">
          <i class="fas fa-map-marker-alt field-icon"></i>
          <input type="text" id="location" placeholder="City, Country" autocomplete="address-level2">
        </div>
      </div>

      <!-- BOTH: Email -->
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope field-icon"></i>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <!-- BOTH: Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock field-icon"></i>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
        </div>
      </div>

      <!-- SIGNUP-ONLY: Terms checkbox -->
      <div class="checkbox-row signup-only" id="termsGroup">
        <input type="checkbox" id="termsCheck">
        <label for="termsCheck">
          I agree to the <a href="#" onclick="return false;">Terms of Service</a> and
          <a href="#" onclick="return false;">Privacy Policy</a>.
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fas fa-sign-in-alt" id="submitIcon"></i>
        <span id="submitText">Sign In</span>
      </button>
    </form>

    <div class="switch-hint">
      <span id="switchHintText">Don't have an account?</span>
      <button type="button" id="switchBtn">Sign up</button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <i class="fas fa-spinner fa-spin spinner"></i>
    <p id="loadingText">Please wait…</p>
  </div>

  <!-- ======================= SCRIPTS ======================= -->
  <!-- 1. Firebase SDKs (order matters) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- 2. Shared config + helpers -->
  <script src="../firebase-config.js"></script>
  <script src="../auth-helpers.js"></script>

  <!-- 3. Page logic -->
  <script src="auth.js"></script>
</body>
</html>
